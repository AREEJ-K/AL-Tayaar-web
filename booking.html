<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطيار الدولي | حجز رحلة</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <img src="fly.jpg" alt="شعار وكالة الطيار الدولي">
    </header>

    <nav>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="packages.html">باقات السفر والسياحة</a></li>
 <li><a href="booking.html" class="active">حجز</a></li>
            <li><a href="contact.html">تواصل</a></li>
        </ul>
    </nav>

    <main>
        <section id="booking">

            <h2>حجز رحلة</h2>

            <p class="booking-intro">
                يرجى تعبئة البيانات التالية لإرسال طلب الحجز.
            </p>

            <form action="booking.php" method="post">

                <div class="form-group">
                    <label for="fullName">الاسم الكامل</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="destinationFrom">من</label>
                    <select id="destinationFrom" name="destinationFrom" required>
                        <option value="" disabled selected>اختر مدينة المغادرة</option>
                        <option value="dammam">الدمام</option>
                        <option value="riyadh">الرياض</option>
                        <option value="jeddah">جدة</option>
                        <option value="abha">أبها</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destinationTo">إلى</label>
                    <select id="destinationTo" name="destinationTo" required>
                        <option value="" disabled selected>اختر الوجهة</option>
                        <option value="thailand">تايلند</option>
                        <option value="azerbaijan">أذربيجان</option>
                        <option value="turkey">تركيا</option>
                        <option value="trabzon">تركيا - طرابزون</option>
                    </select>
                </div>

                <button type="submit">إرسال طلب الحجز</button>

            </form>

        </section>
    </main>
<footer>
    <p>الطيار الدولي للسفر والسياحة</p>
    <p>© 2024 جميع الحقوق محفوظة</p>
</footer>

</body>
</html>
